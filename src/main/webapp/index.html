<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>FoodKeeper</title>
</head>
<body>
	<header>
		<h1>FoodKeeper</h1>
	</header>
	<main>
		<section class = "food_add">
			<h2>食品情報入力</h2>
			<form> <!--サーバーに送る-->
				<ul>
					<li>
						<label for="name">商品名</label>
						<input type="text" name="name" id="name">
					</li>
					<li>
						<label for="date">期限</label>
						<input type="date" name="date" id="date">
					</li>
					<li>
						<label for="quanity">個数</label>
						<input type="number" name="quanity" id="quanity">
					</li>
					<li>
						<button type="submit">登録</button>
					</li>
				</ul>
			</form>
		</section>
		<section class = "food_date">
			
		</section>
	</main>
</body>
</html>
